services:
  split-extract:
    build: .
    container_name: split-extract
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
      HOST: 0.0.0.0
      PORT: 8001
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
